name = "Catppuccin Latte"
dark = false

[colors]
background = "#eff1f5" # base
surface = "#e6e9ef"    # mantle
panel = "#ccd0da"      # surface0
border = "#bcc0cc"     # surface1
text = "#4c4f69"       # text
muted = "#6c6f85"      # subtext0
subtle = "#9ca0b0"     # overlay0
accent = "#1e66f5"     # blue
