# Weekly updates for the two locks and for the pinned actions. A version is offered once it has been out for two
# weeks, so it has had time to be noticed. Review what a bump brings before merging it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      tools:
        patterns: ["bandit", "build", "mypy", "pip-audit", "pytest*", "ruff"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
