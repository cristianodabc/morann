# Every check `make check` runs, one job each, on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Build .venv from the two locks
        run: make setup
      - run: make lint
      - run: make types
      - run: make security

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Build .venv from the two locks
        run: make setup
      - name: Run the tests with the coverage gate, on every core
        # The UI tests spend most of their time waiting for the app to go idle after each key, not on the CPU.
        run: make test PYTEST_ARGS="-n auto"
      - name: Keep the coverage report
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  shell:
    name: Shell scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHFMT_VERSION: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shfmt and actionlint, checked against their published digests
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --output "$tools/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $tools/shfmt" | sha256sum --check --strict
          chmod +x "$tools/shfmt"
          curl --fail --silent --show-error --location --output "$tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tools/actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools/actionlint.tar.gz" --directory "$tools" actionlint
          echo "$tools" >>"$GITHUB_PATH"
      - run: make shell
      - run: make workflows

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Build .venv from the two locks
        run: make setup
      - run: make audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history is scanned, not only the last commit
          persist-credentials: false
      - name: Install gitleaks, checked against its published digest
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --output "$tools/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tools/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools/gitleaks.tar.gz" --directory "$tools" gitleaks
          echo "$tools" >>"$GITHUB_PATH"
      - run: make secrets

  build:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Build .venv from the two locks
        run: make setup
      - name: Build the sdist and the wheel, install the wheel and run mor --help
        run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
